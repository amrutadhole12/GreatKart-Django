{% extends 'base.html' %}

{% block content %}
<section class="min-h-screen flex items-center justify-center bg-white py-10">

    <div class="w-full max-w-md border rounded-lg shadow-sm p-6 bg-white">

        <h1 class="text-3xl mb-2">Password assistance</h1>

        <p class="text-sm text-gray-600 mb-5">
            Enter the email address associated with your account.
        </p>

        {% include 'includes/alerts.html' %}

        <form action="{% url 'forgotPassword' %}" method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block mb-2 font-medium">
                    Email address
                </label>

                <input
                    type="email"
                    name="email"
                    required
                    class="w-full border rounded px-3 py-2"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-yellow-400 hover:bg-yellow-500 py-2 rounded"
            >
                Continue
            </button>
        </form>

        <div class="mt-4">
            <a href="{% url 'login' %}" class="text-blue-600">
                ← Back to Sign In
            </a>
        </div>

    </div>

</section>
{% endblock %}
