{% extends 'base.html' %}

{% block content %}
<section class="min-h-screen bg-white flex flex-col items-center py-10">

    <!-- Reset Password Card -->
    <div class="w-full max-w-sm border border-gray-300 rounded-lg bg-white p-6">
        <h1 class="text-3xl font-normal mb-4">
            Reset Password
        </h1>

        {% include 'includes/alerts.html' %}

        <form action="{% url 'resetPassword' %}" method="POST" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-bold text-gray-900 mb-1">
                    New Password
                </label>
                <input
                    type="password"
                    name="password"
                    required
                    class="w-full px-3 py-2 border border-gray-400 rounded focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500"
                >
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-900 mb-1">
                    Confirm Password
                </label>
                <input
                    type="password"
                    name="confirm_password"
                    required
                    class="w-full px-3 py-2 border border-gray-400 rounded focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-yellow-400 hover:bg-yellow-500 border border-yellow-600 text-black py-2 rounded text-sm"
            >
                Reset Password
            </button>
        </form>

        <div class="mt-4 text-sm text-gray-700">
            Passwords must be at least 8 characters long.
        </div>
    </div>

    <!-- Bottom Link -->
    <div class="mt-6 text-sm">
        <span class="text-gray-600">Don't have an account?</span>
        <a href="{% url 'register' %}" class="text-blue-600 hover:underline ml-1">
            Sign up
        </a>
    </div>

</section>
{% endblock %}
