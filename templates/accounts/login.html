{% extends 'base.html' %} {% load static %} {% block content %}

<section
  class="min-h-screen bg-slate-50 flex items-center justify-center py-12 px-4"
>
  <div class="w-full max-w-md">
    <div
      class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8 md:p-10"
    >
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-slate-900">Welcome Back</h1>

        <p class="mt-2 text-slate-500">
          Login to continue your shopping journey
        </p>
      </div>

      {% include 'includes/alerts.html' %}

      <form action="{% url 'login' %}" method="POST" class="space-y-5">
        {% csrf_token %}

        <!-- EMAIL -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">
            Email Address
          </label>

          <input
            type="email"
            name="email"
            required
            placeholder="Enter your email"
            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
          />
        </div>

        <!-- PASSWORD -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">
            Password
          </label>

          <input
            type="password"
            name="password"
            required
            placeholder="Enter your password"
            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
          />
        </div>

        <!-- OPTIONS -->
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 text-slate-600">
            <input type="checkbox" class="rounded border-slate-300" />
            Remember me
          </label>

          <a
            href="{% url 'forgotPassword' %}"
            class="text-indigo-600 hover:text-indigo-700 font-medium"
          >
            Forgot Password?
          </a>
        </div>

        <!-- BUTTON -->
        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-md"
        >
          Login
        </button>
      </form>

      <!-- DIVIDER -->
      <div class="my-6 flex items-center gap-3">
        <div class="flex-1 h-px bg-slate-200"></div>
        <span class="text-slate-400 text-sm">OR</span>
        <div class="flex-1 h-px bg-slate-200"></div>
      </div>

      <!-- SOCIAL -->
      <div class="grid grid-cols-2 gap-3">
        <button
          type="button"
          class="border border-slate-300 rounded-xl py-3 text-sm font-medium hover:bg-slate-50 transition"
        >
          Google
        </button>

        <button
          type="button"
          class="border border-slate-300 rounded-xl py-3 text-sm font-medium hover:bg-slate-50 transition"
        >
          Facebook
        </button>
      </div>

      <!-- REGISTER LINK -->
      <div class="text-center mt-6 text-sm text-slate-600">
        Don't have an account?

        <a
          href="{% url 'register' %}"
          class="text-indigo-600 font-semibold hover:text-indigo-700"
        >
          Create Account
        </a>
      </div>
    </div>
  </div>
</section>

{% endblock %}
