{% if messages %}
    {% for message in messages %}
        <div class="mb-4 flex items-center rounded-md border border-[#d5d9d9] bg-white px-4 py-3 shadow-sm">
            <span class="mr-3 text-green-600 text-lg">✓</span>
            <p class="text-sm text-gray-700">
                {{ message }}
            </p>
        </div>
    {% endfor %}
{% endif %}
